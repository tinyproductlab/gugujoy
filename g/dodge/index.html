<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>躲避陨石 · 谷谷乐园</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="description" content="躲避陨石：谷谷乐园出品的反应小游戏，左右闪避从天而降的陨石，活得越久分越高！触控拖动、鼠标或方向键都能玩。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF7EC;color:#5C3D2E;-webkit-tap-highlight-color:transparent}
.topbar{max-width:520px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.topbar a.home{color:#8A6B58;text-decoration:none;font-size:14px}
.container{width:500px;max-width:100%;margin:0 auto;padding:0 16px 30px}
.heading{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
h1.title{font-size:40px;font-weight:900;color:#D97A12}
.scores{display:flex;gap:8px}
.score-box{background:#fff;border:2px solid #F3D9B8;border-radius:10px;padding:8px 18px;text-align:center;min-width:86px}
.score-box .num{font-size:22px;font-weight:800}
.score-box .label{font-size:12px;color:#B08D6E}
.above{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.intro{font-size:14px;color:#8A6B58;line-height:1.6}
.restart{background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff;border:0;border-radius:999px;padding:10px 26px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(240,144,42,.35);white-space:nowrap}
.game-wrap{position:relative;background:#E3B98A;border-radius:14px;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;border-radius:8px;background:#22303E}
.msg{display:none;position:absolute;inset:12px;background:rgba(255,247,236,.9);border-radius:8px;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.msg.show{display:flex}
.msg p{font-size:30px;font-weight:900}
.msg .sub{font-size:15px;color:#8A6B58}
.msg button{border:0;border-radius:999px;padding:10px 30px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff}
.howto{margin-top:18px;font-size:14px;color:#8A6B58;line-height:1.8;background:#fff;border:2px solid #FFE3B8;border-radius:14px;padding:16px 18px}
.howto b{color:#D97A12}
.credit{margin-top:14px;font-size:12px;color:#B08D6E;text-align:center}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="/">← 谷谷乐园</a><span style="font-size:13px;color:#B08D6E">🐾 小产品实验室</span></div>
<div class="container">
<div class="heading">
<h1 class="title">☄️ 躲避陨石</h1>
<div class="scores">
<div class="score-box"><div class="num" id="score">0.0</div><div class="label">存活(秒)</div></div>
<div class="score-box"><div class="num" id="best">0.0</div><div class="label">最高(秒)</div></div>
</div>
</div>
<div class="above">
<p class="intro">左右移动小飞船 <b>🛸</b>，躲开从天而降的陨石！存活时间越长，陨石越快越密。</p>
<button class="restart" id="restart">新开一局</button>
</div>
<div class="game-wrap" id="wrap">
<canvas id="cv" width="440" height="560"></canvas>
<div class="msg" id="msg"><p id="msgText">☄️ 被砸中啦！</p><div class="sub" id="msgSub"></div><button id="again">再来一局</button></div>
</div>
<div class="howto"><b>🐾 玩法说明：</b>手机按住飞船左右拖动，电脑用鼠标移动或 ← → 方向键。被任意一颗陨石碰到游戏结束，存活时间（精确到 0.1 秒）就是得分。时间越久陨石下落越快、数量越多！</div>
<p class="credit">小产品实验室出品 · 谷谷乐园</p>
</div>
<script>
(function(){
"use strict";
var W=440, H=560;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'), bestEl=document.getElementById('best');
var msg=document.getElementById('msg'), msgSub=document.getElementById('msgSub');
var S=null, raf=null, lastT=0;
var best=0;
try{ best=parseFloat(localStorage.getItem('gugujoy_dodge_best')||'0')||0; }catch(e){}
bestEl.textContent=best.toFixed(1);

function reset(){
  S={px:W/2,py:H-64,rocks:[],stars:[],time:0,alive:true,left:false,right:false,spawnAcc:0,flash:0,spawned:0};
  for(var i=0;i<50;i++) S.stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.4});
  scoreEl.textContent='0.0'; msg.classList.remove('show');
  if(raf) cancelAnimationFrame(raf); lastT=performance.now();
  raf=requestAnimationFrame(loop);
}
function diff(){ return Math.min(1,S.time/75); } // 0..1 over 75s
function spawnRock(){
  var d=diff();
  var r=14+Math.random()*16;
  S.spawned++;
  S.rocks.push({x:r+Math.random()*(W-2*r),y:-r*2,r:r,
    spd:(150+Math.random()*120)*(1+d*1.6),
    vx:(Math.random()-0.5)*60*d, rot:Math.random()*6.28, vr:(Math.random()-0.5)*3});
}
function loop(t){
  if(!S.alive) return;
  var dt=Math.min(50,t-lastT); lastT=t;
  step(dt);
  draw();
  raf=requestAnimationFrame(loop);
}
function step(dt){
  S.time+=dt/1000;
  var d=diff();
  // player
  var spd=340*dt/1000;
  if(S.left) S.px-=spd;
  if(S.right) S.px+=spd;
  S.px=Math.max(24,Math.min(W-24,S.px));
  // spawn faster & denser over time
  S.spawnAcc+=dt/1000*(0.9+d*3.2);
  while(S.spawnAcc>=1){ S.spawnAcc--; spawnRock(); }
  // rocks
  for(var i=S.rocks.length-1;i>=0;i--){
    var k=S.rocks[i];
    k.y+=k.spd*dt/1000; k.x+=k.vx*dt/1000; k.rot+=k.vr*dt/1000;
    if(k.y>H+k.r*2){ S.rocks.splice(i,1); continue; }
    // collision: circle vs player circle
    var dx=k.x-S.px, dy=k.y-S.py;
    if(!S.inv&&dx*dx+dy*dy < (k.r*0.75+16)*(k.r*0.75+16)){ die(); return; }
  }
  if(S.flash>0) S.flash-=dt;
  var sc=Math.floor(S.time*10)/10;
  scoreEl.textContent=sc.toFixed(1);
}
function die(){
  S.alive=false; if(raf) cancelAnimationFrame(raf);
  var sc=Math.floor(S.time*10)/10;
  if(sc>best){best=sc;try{localStorage.setItem('gugujoy_dodge_best',String(best));}catch(e){}}
  bestEl.textContent=best.toFixed(1);
  scoreEl.textContent=sc.toFixed(1);
  msgSub.textContent='存活 '+sc.toFixed(1)+' 秒 · 历史最高 '+best.toFixed(1)+' 秒';
  msg.classList.add('show');
}
function draw(){
  ctx.fillStyle='#22303E'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';
  for(var i=0;i<S.stars.length;i++){var st=S.stars[i];ctx.globalAlpha=0.45;ctx.fillRect(st.x,st.y,st.r,st.r);}
  ctx.globalAlpha=1;
  // rocks
  ctx.font='10px serif';
  for(var j=0;j<S.rocks.length;j++){var k=S.rocks[j];
    ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(k.rot);
    ctx.font=(k.r*2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('☄️',0,0); ctx.restore();}
  // player ship
  ctx.font='36px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('🛸',S.px,S.py);
  if(S.flash>0){ ctx.fillStyle='rgba(240,80,40,.35)'; ctx.fillRect(0,0,W,H); }
}
function canvasX(clientX){
  var r=cv.getBoundingClientRect(); return (clientX-r.left)/r.width*W;
}
document.getElementById('restart').onclick=reset;
document.getElementById('again').onclick=reset;
document.addEventListener('keydown',function(e){
  if(e.keyCode===37){S.left=true;e.preventDefault();}
  else if(e.keyCode===39){S.right=true;e.preventDefault();}
});
document.addEventListener('keyup',function(e){
  if(e.keyCode===37) S.left=false; else if(e.keyCode===39) S.right=false;
});
var wrap=document.getElementById('wrap');
wrap.addEventListener('touchstart',function(e){ if(S&&S.alive) S.px=canvasX(e.changedTouches[0].clientX); },{passive:true});
wrap.addEventListener('touchmove',function(e){ e.preventDefault(); if(S&&S.alive) S.px=canvasX(e.changedTouches[0].clientX); },{passive:false});
cv.addEventListener('mousemove',function(e){ if(S&&S.alive) S.px=canvasX(e.clientX); });
reset();

window.__test={
  reset:reset,
  step:function(dt){ if(S&&S.alive) step(dt); },
  spawnRockAt:function(x,y,r,spd){ S.rocks.push({x:x,y:y,r:r||20,spd:spd||0,vx:0,rot:0,vr:0}); },
  setPlayer:function(x){ S.px=x; },
  setTime:function(t){ S.time=t; },
  state:function(){ return {alive:S.alive,time:S.time,rocks:S.rocks.length,px:S.px,spawned:S.spawned,
    rockSpeed:S.rocks.length?S.rocks[0].spd:null}; },
  spawnReal:function(){ spawnRock(); },
  lastRockSpeed:function(){ var k=S.rocks[S.rocks.length-1]; return k?k.spd:null; },
  clearRocks:function(){ S.rocks=[]; S.spawnAcc=-99999; },
  setSpawnAcc:function(v){ S.spawnAcc=v; },
  god:function(){ S.inv=true; }
};
})();
</script>
</body>
</html>
