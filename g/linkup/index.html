<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>连连看 · 谷谷乐园</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="description" content="连连看：谷谷乐园出品的经典消除小游戏，两张相同图案、拐弯不超过两次就能消！手机点选、电脑鼠标都能玩。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF7EC;color:#5C3D2E;-webkit-tap-highlight-color:transparent}
.topbar{max-width:520px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.topbar a.home{color:#8A6B58;text-decoration:none;font-size:14px}
.container{width:500px;max-width:100%;margin:0 auto;padding:0 16px 30px}
.heading{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
h1.title{font-size:40px;font-weight:900;color:#D97A12}
.scores{display:flex;gap:8px}
.score-box{background:#fff;border:2px solid #F3D9B8;border-radius:10px;padding:8px 18px;text-align:center;min-width:86px}
.score-box .num{font-size:22px;font-weight:800}
.score-box .label{font-size:12px;color:#B08D6E}
.above{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.intro{font-size:14px;color:#8A6B58;line-height:1.6}
.restart{background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff;border:0;border-radius:999px;padding:10px 26px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(240,144,42,.35);white-space:nowrap}
.game-wrap{position:relative;background:#E3B98A;border-radius:14px;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.tile{aspect-ratio:1;background:#FFF8E7;border:2px solid #F3D9B8;border-radius:10px;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s}
.tile.sel{background:#FFE3B8;border-color:#F0902A;transform:scale(1.08)}
.tile.hint{background:#FFF3D6;border-color:#D97A12;animation:blink .5s 3}
.tile.gone{visibility:hidden}
@keyframes blink{50%{transform:scale(1.15)}}
.tools{display:flex;gap:8px;justify-content:center;margin-top:10px}
.tool{background:#fff;border:2px solid #F3D9B8;border-radius:999px;padding:8px 20px;font-size:14px;font-weight:700;color:#D97A12;cursor:pointer}
.tool:disabled{opacity:.4;cursor:default}
.msg{display:none;position:absolute;inset:12px;background:rgba(255,247,236,.92);border-radius:8px;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.msg.show{display:flex}
.msg p{font-size:30px;font-weight:900}
.msg .sub{font-size:15px;color:#8A6B58}
.msg button{border:0;border-radius:999px;padding:10px 30px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff}
.howto{margin-top:18px;font-size:14px;color:#8A6B58;line-height:1.8;background:#fff;border:2px solid #FFE3B8;border-radius:14px;padding:16px 18px}
.howto b{color:#D97A12}
.credit{margin-top:14px;font-size:12px;color:#B08D6E;text-align:center}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="/">← 谷谷乐园</a><span style="font-size:13px;color:#B08D6E">🐾 小产品实验室</span></div>
<div class="container">
<div class="heading">
<h1 class="title">🀄 连连看</h1>
<div class="scores">
<div class="score-box"><div class="num" id="score">0</div><div class="label">得分</div></div>
<div class="score-box"><div class="num" id="time">0</div><div class="label">用时(秒)</div></div>
<div class="score-box"><div class="num" id="best">0</div><div class="label">最高</div></div>
</div>
</div>
<div class="above">
<p class="intro">点选两张相同图案，折线不超过 <b>两折</b> 就能连通消除！消除有短暂冷却，无解会自动洗牌。</p>
<button class="restart" id="restart">新开一局</button>
</div>
<div class="game-wrap" id="wrap">
<div id="board"></div>
<div class="msg" id="msg"><p id="msgText">🎉 全部消除！</p><div class="sub" id="msgSub"></div><button id="again">再来一局</button></div>
</div>
<div class="tools">
<button class="tool" id="hintBtn">💡 提示（<span id="hintN">3</span>）</button>
<button class="tool" id="shuffleBtn">🔀 洗牌</button>
</div>
<div class="howto"><b>🐾 玩法说明：</b>点击两张相同图案的牌，如果能用 0 折（直连）、1 折或 2 折的折线连起来就消除成功，每对得 10 分，连消有加成。无解时会自动洗牌。提示按钮每局可用 3 次。</div>
<p class="credit">小产品实验室出品 · 谷谷乐园</p>
</div>
<script>
(function(){
"use strict";
var COLS=8, ROWS=6, PAIRS=24;
var EMOJI=['🍎','🍇','🍉','🍒','🍋','🍑','🥝','🍓','🐶','🐱','🐰','🐼','🐨','🐯','🐸','🐷','🐙','🦁','🐝','🦋','🌸','🌻','🍀','⭐'];
var board=document.getElementById('board');
var scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), bestEl=document.getElementById('best');
var hintBtn=document.getElementById('hintBtn'), hintN=document.getElementById('hintN'), shuffleBtn=document.getElementById('shuffleBtn');
var msg=document.getElementById('msg'), msgSub=document.getElementById('msgSub');
var S=null, timer=null;
var best=0;
try{ best=parseInt(localStorage.getItem('gugujoy_linkup_best')||'0',10)||0; }catch(e){}
bestEl.textContent=best;

function reset(){
  var icons=EMOJI.slice(0,PAIRS);
  var deck=[];
  for(var i=0;i<PAIRS;i++){ deck.push(icons[i]); deck.push(icons[i]); }
  shuffleArr(deck);
  var grid=[];
  for(var r=0;r<ROWS;r++){ grid.push([]); for(var c=0;c<COLS;c++) grid[r].push(deck[r*COLS+c]); }
  S={grid:grid,sel:null,score:0,time:0,over:false,cool:false,hints:3,remain:PAIRS*2,combo:0,comboCd:0};
  ensureSolvable();
  scoreEl.textContent='0'; timeEl.textContent='0'; hintN.textContent='3';
  msg.classList.remove('show');
  render();
  if(timer) clearInterval(timer);
  timer=setInterval(function(){ if(!S.over){ S.time++; timeEl.textContent=S.time; if(S.comboCd>0){S.comboCd--; if(S.comboCd===0)S.combo=0;} } },1000);
}
function shuffleArr(a){ for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0;var t=a[i];a[i]=a[j];a[j]=t;} }
// ---- path finding: 0/1/2-bend connectivity on grid with virtual border ----
function gridAt(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS) return null; // outside = free
  return S.grid[r][c];
}
// straight line clear between (r1,c1)-(r2,c2) exclusive of endpoints
function lineClear(r1,c1,r2,c2){
  if(r1===r2){ var a=Math.min(c1,c2),b=Math.max(c1,c2);
    for(var c=a+1;c<b;c++) if(gridAt(r1,c)!==null) return false; return true; }
  if(c1===c2){ var d=Math.min(r1,r2),e=Math.max(r1,r2);
    for(var r=d+1;r<e;r++) if(gridAt(r,c1)!==null) return false; return true; }
  return false;
}
// returns corner point list [] if connectable with <=2 bends, else null
function findPath(r1,c1,r2,c2){
  if(r1===r2&&c1===c2) return null;
  if(S.grid[r1][c1]===null||S.grid[r2][c2]===null) return null;
  if(S.grid[r1][c1]!==S.grid[r2][c2]) return null;
  // temporarily free the endpoints for traversal
  var g=S.grid;
  // 0 bends
  if((r1===r2||c1===c2)&&lineClear(r1,c1,r2,c2)) return [];
  // 1 bend: corner (r1,c2) or (r2,c1) must be free
  var corners=[[r1,c2],[r2,c1]];
  for(var i=0;i<2;i++){ var cr=corners[i][0], cc=corners[i][1];
    if(gridAt(cr,cc)===null&&lineClear(r1,c1,cr,cc)&&lineClear(cr,cc,r2,c2)) return [[cr,cc]]; }
  // 2 bends: sweep rows
  for(var r=-1;r<=ROWS;r++){
    if(gridAt(r,c1)!==null||gridAt(r,c2)!==null) continue;
    if(lineClear(r1,c1,r,c1)&&lineClear(r2,c2,r,c2)&&lineClear(r,c1,r,c2)) return [[r,c1],[r,c2]];
  }
  // 2 bends: sweep cols
  for(var c=-1;c<=COLS;c++){
    if(gridAt(r1,c)!==null||gridAt(r2,c)!==null) continue;
    if(lineClear(r1,c1,r1,c)&&lineClear(r2,c2,r2,c)&&lineClear(r1,c,r2,c)) return [[r1,c],[r2,c]];
  }
  return null;
}
function findAnyPair(){
  var cells=[];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(S.grid[r][c]!==null) cells.push([r,c]);
  for(var i=0;i<cells.length;i++) for(var j=i+1;j<cells.length;j++){
    var a=cells[i], b=cells[j];
    if(S.grid[a[0]][a[1]]===S.grid[b[0]][b[1]]){
      var p=findPath(a[0],a[1],b[0],b[1]);
      if(p!==null) return [a,b,p];
    }
  }
  return null;
}
function ensureSolvable(){
  var guard=0;
  while(!findAnyPair()&&guard++<50) shuffleGrid();
}
function shuffleGrid(){
  var vals=[];
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++) if(S.grid[r][c]!==null) vals.push(S.grid[r][c]);
  shuffleArr(vals);
  var k=0;
  for(var r2=0;r2<ROWS;r2++) for(var c2=0;c2<COLS;c2++) if(S.grid[r2][c2]!==null) S.grid[r2][c2]=vals[k++];
  S.sel=null;
}
function addScore(n){
  S.score+=n; scoreEl.textContent=S.score;
  if(S.score>best){best=S.score;bestEl.textContent=best;try{localStorage.setItem('gugujoy_linkup_best',String(best));}catch(e){}}
}
function render(){
  board.innerHTML='';
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    (function(r,c){
      var v=S.grid[r][c];
      var d=document.createElement('div');
      d.className='tile'+(v===null?' gone':'')+(S.sel&&S.sel[0]===r&&S.sel[1]===c?' sel':'');
      d.textContent=v===null?'':v;
      d.onclick=function(){onPick(r,c);};
      board.appendChild(d);
    })(r,c);
  }
}
function onPick(r,c){
  if(S.over||S.cool) return;
  if(S.grid[r][c]===null) return;
  if(S.sel&&S.sel[0]===r&&S.sel[1]===c){ S.sel=null; render(); return; }
  if(!S.sel){ S.sel=[r,c]; render(); return; }
  var a=S.sel; S.sel=null;
  var path=findPath(a[0],a[1],r,c);
  if(path!==null){
    S.grid[a[0]][a[1]]=null; S.grid[r][c]=null;
    S.remain-=2;
    S.combo++; S.comboCd=3;
    addScore(10+(S.combo>=2?5*(S.combo-1):0));
    S.cool=true; setTimeout(function(){S.cool=false;},1000);
    render();
    if(S.remain===0){ win(); return; }
    if(!findAnyPair()){ ensureSolvable(); render(); }
  } else { render(); }
}
function win(){
  S.over=true; clearInterval(timer);
  var bonus=Math.max(0,300-S.time*2);
  if(bonus>0) addScore(bonus);
  msgSub.textContent='本局得分 '+S.score+'（用时 '+S.time+' 秒）· 历史最高 '+best;
  document.getElementById('msgText').textContent='🎉 全部消除！';
  msg.classList.add('show');
}
hintBtn.onclick=function(){
  if(S.over||S.hints<=0) return;
  var pair=findAnyPair();
  if(!pair) return;
  S.hints--; hintN.textContent=S.hints;
  if(S.hints<=0) hintBtn.disabled=true;
  var tiles=board.children;
  [pair[0],pair[1]].forEach(function(p){
    var idx=p[0]*COLS+p[1];
    var el=tiles[idx];
    el.classList.add('hint');
    setTimeout(function(){el.classList.remove('hint');},1500);
  });
};
shuffleBtn.onclick=function(){ if(!S.over){ shuffleGrid(); ensureSolvable(); render(); } };
document.getElementById('restart').onclick=reset;
document.getElementById('again').onclick=reset;
var wrap=document.getElementById('wrap');
wrap.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
reset();

window.__test={
  reset:reset,
  setGrid:function(g){ S.grid=g.map(function(row){return row.slice();}); S.sel=null; S.remain=0;
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)if(S.grid[r][c]!==null)S.remain++; render(); },
  findPath:function(r1,c1,r2,c2){ return findPath(r1,c1,r2,c2); },
  pick:function(r,c){ onPick(r,c); },
  findAnyPair:function(){ return findAnyPair(); },
  state:function(){ return {score:S.score,remain:S.remain,over:S.over,time:S.time,hints:S.hints}; },
  forceShuffle:function(){ shuffleGrid(); },
  grid:function(){ return S.grid.map(function(row){return row.slice();}); }
};
})();
</script>
</body>
</html>
