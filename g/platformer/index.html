<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF7EC;color:#5C3D2E;-webkit-tap-highlight-color:transparent}
.topbar{max-width:520px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.topbar a.home{color:#8A6B58;text-decoration:none;font-size:14px}

</style>

<body>
<div class="topbar"><a class="home" href="/">← 谷谷乐园</a><span style="font-size:13px;color:#B08D6E">🐾 小产品实验室</span></div>
<div class="container">
<div class="heading">
<h1 class="title">🦘 超级跳跃</h1>
<div class="scores">
<div class="score-box"><div class="num" id="score">0</div><div class="label">得分</div></div>
<div class="score-box"><div class="num" id="level">1</div><div class="label">关卡</div></div>
<div class="score-box"><div class="num" id="lives">3</div><div class="label">生命 ❤</div></div>
</div>
</div>
<div class="above">
<p class="intro">帮助袋鼠<b>阿跳</b>一路向右！顶 <b>?</b> 砖出金币，踩漫步怪的头，躲开尖刺，冲到终点旗！</p>
<button class="restart" id="restart">新开一局</button>
</div>
<div class="game-wrap" id="wrap">
<canvas id="cv" width="480" height="320"></canvas>
<div class="touchbtn" id="touchbtn">
<button id="btnL">◀</button><button id="btnR">▶</button><button id="btnJ" class="jump">⤒</button>
</div>
<div class="msg" id="msg"><p id="msgText"></p><div class="sub" id="msgSub"></div><button id="again">再来一局</button></div>
</div>
<div class="howto"><b>🐾 玩法说明：</b>电脑用 ← → / A D 移动，空格 / ↑ / W 跳跃（按住跳更高）；手机点屏幕下方 ◀ ▶ 移动、⤒ 跳跃。从头顶踩漫步怪得 100 分，侧面撞到会掉命；金币 +10 分，? 砖顶出金币；掉进深渊或碰到尖刺也会掉命，3 条命用完游戏结束。到达终点旗过关，共 3 关！</div>
<p class="credit">小产品实验室出品 · 谷谷乐园</p>
</div>
<script>
(function(){
"use strict";
/* ================= 常量 ================= */
var TW=32, VW=480, VH=320;
var GRAV=2400, JUMP_V=700, MOVE_V=230, ACC_G=3000, ACC_A=1800, FRIC=2600, MAXFALL=950;
var COYOTE=0.09, JBUF=0.12;

/* ================= 音效（WebAudio 现場合成，无外部文件） ================= */
var AC=null;
function ac(){ try{
  if(!AC){ var Ctor=window.AudioContext||window.webkitAudioContext; if(!Ctor) return null; AC=new Ctor(); }
  if(AC.state==='suspended') AC.resume(); return AC;
}catch(e){ return null; } }
function tone(f0,f1,dur,type,vol,delay){
  var c=ac(); if(!c) return;
  try{
    var t0=c.currentTime+(delay||0);
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(f0,1),t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t0+dur);
    g.gain.setValueAtTime(vol||0.05,t0);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sfx(n){
  if(n==='jump') tone(280,660,0.14,'square',0.045);
  else if(n==='coin'){ tone(950,950,0.07,'square',0.04); tone(1420,1420,0.14,'square',0.04,0.07); }
  else if(n==='stomp') tone(320,90,0.14,'triangle',0.07);
  else if(n==='bump') tone(160,90,0.09,'square',0.05);
  else if(n==='hurt') tone(420,110,0.28,'sawtooth',0.06);
  else if(n==='clear'){ tone(659,659,0.14,'square',0.05); tone(880,880,0.16,'square',0.05,0.11); }
  else if(n==='win'){ var ns=[523,659,784,1047]; for(var i=0;i<ns.length;i++) tone(ns[i],ns[i],0.16,'square',0.05,i*0.13); }
}

/* ================= 关卡（字符串 tilemap，手排） =================
   # 地面砖块  ? 问号砖（顶出金币）  C 金币  E 漫步怪  P 尖刺  G 终点旗  S 出生点 */
var LEVELS=[
{name:'青青草原', map:[
".............................................",
".............................................",
".............................................",
".............................................",
"...........C.................................",
".........C.C.C......C.C......................",
".........?????......?........................",
"...........................................G.",
"..S.....E.......E..........E.....C...........",
"####################################...######"
]},
{name:'颠簸山丘', map:[
".......................................................",
".......................................................",
".......................................................",
".......................................................",
".................C.....................................",
"...............C.C.C.....................C.C...........",
".............?.........................?...............",
".............................#####..................G..",
"..S.....E................................P......C.E....",
"########################...###################...######"
]},
{name:'天空之城', map:[
".................................................................",
".................................................................",
".................................................................",
"...........................C.....................................",
".........................C.C.C...............C...................",
"..................?......?????.......?.......?...................",
"............................................................G....",
".....?....................#####.....................#####........",
"..S.....E.......E............E...P...E......P......E.....C.......",
"#####################...########################...##############"
]}
];

/* ================= DOM ================= */
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'), levelEl=document.getElementById('level'), livesEl=document.getElementById('lives');
var bestEl=null;
var msg=document.getElementById('msg'), msgText=document.getElementById('msgText'),
    msgSub=document.getElementById('msgSub'), againBtn=document.getElementById('again');

/* ================= 状态 ================= */
var S=null, best=0;
try{ best=parseInt(localStorage.getItem('gugujoy_platformer_best')||'0',10)||0; }catch(e){}

function parseLevel(idx){
  var rows=LEVELS[idx].map, R=rows.length, C=rows[0].length;
  var grid=[], enemies=[], coins=[], spikes=[], spikeSet={}, goalX=0, sx=0;
  for(var y=0;y<R;y++){ grid.push([]); for(var x=0;x<C;x++){
    var ch=rows[y].charAt(x); grid[y].push(ch);
    if(ch==='S'){ sx=x*TW+5; grid[y][x]='.'; }
    else if(ch==='E'){ enemies.push({x:x*TW+2,y:y*TW-24,w:28,h:24,vx:-45,vy:0,alive:true,squish:0,walkT:Math.random()*6,onGround:false,hitWall:false}); grid[y][x]='.'; }
    else if(ch==='C'){ coins.push({x:x*TW+8,y:y*TW+8,w:16,h:16,taken:false,ph:Math.random()*6.28}); grid[y][x]='.'; }
    else if(ch==='P'){ spikes.push({x:x*TW+4,y:y*TW+TW-14,w:24,h:14}); spikeSet[x+','+y]=1; grid[y][x]='.'; }
    else if(ch==='G'){ goalX=x*TW; grid[y][x]='.'; }
  }}
  return {grid:grid,R:R,C:C,enemies:enemies,coins:coins,spikes:spikes,spikeSet:spikeSet,goalX:goalX,sx:sx};
}

function updateHUD(){
  scoreEl.textContent=S.score; levelEl.textContent=(S.level+1)+' / 3'; livesEl.textContent=S.lives;
}

function startLevel(idx, keepScore){
  var P=parseLevel(idx);
  var sc=keepScore?S.score:0, lv=keepScore?S.lives:3;
  S={ level:idx, score:sc, lives:lv, state:'play', L:P,
      player:{x:P.sx,y:8*TW-28,w:22,h:28,vx:0,vy:0,face:1,onGround:false,coyote:0,jbuf:0,invuln:0,walkT:0,hitWall:false,hitHead:false},
      parts:[], bump:{}, camX:0, time:0 };
  msg.classList.remove('show');
  updateHUD();
}
function resetGame(){
  S={score:0,lives:3};
  startLevel(0,false);
  msg.classList.remove('show');
}

/* ================= 物理 ================= */
function solidAt(tx,ty,L){
  if(tx<0||tx>=L.C) return true;
  if(ty<0||ty>=L.R) return false;
  var ch=L.grid[ty][tx]; return ch==='#'||ch==='?'||ch==='U';
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

function collideMove(b,dx,dy,L,onHeadBump){
  b.x+=dx;
  var y0=Math.floor(b.y/TW), y1=Math.floor((b.y+b.h-1)/TW), ty, tx;
  if(dx>0){ tx=Math.floor((b.x+b.w)/TW);
    for(ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,L)){ b.x=tx*TW-b.w-0.01; b.hitWall=true; break; }
  }else if(dx<0){ tx=Math.floor(b.x/TW);
    for(ty=y0;ty<=y1;ty++) if(solidAt(tx,ty,L)){ b.x=(tx+1)*TW+0.01; b.hitWall=true; break; }
  }
  b.y+=dy; b.onGround=false; b.hitHead=false;
  var x0=Math.floor(b.x/TW), x1=Math.floor((b.x+b.w-1)/TW);
  if(dy>0){ ty=Math.floor((b.y+b.h)/TW);
    for(tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,L)){ b.y=ty*TW-b.h; b.vy=0; b.onGround=true; break; }
  }else if(dy<0){ ty=Math.floor(b.y/TW);
    for(tx=x0;tx<=x1;tx++) if(solidAt(tx,ty,L)){ b.y=(ty+1)*TW+0.01; b.vy=0; b.hitHead=true; if(onHeadBump) onHeadBump(tx,ty); break; }
  }
}

function addScore(n){ S.score+=n; if(S.score>best){best=S.score; try{localStorage.setItem('gugujoy_platformer_best',String(best));}catch(e){}} updateHUD(); }

/* ================= 粒子 ================= */
function puff(x,y){ for(var i=0;i<8;i++) S.parts.push({x:x,y:y,vx:(Math.random()-0.5)*160,vy:-Math.random()*160-40,life:0.4,max:0.4,c:'#FFF',s:3}); }
function poof(x,y){ for(var i=0;i<10;i++) S.parts.push({x:x,y:y,vx:(Math.random()-0.5)*220,vy:-Math.random()*200-30,life:0.45,max:0.45,c:'#E8BC7E',s:4}); }
function sparkle(x,y){ for(var i=0;i<6;i++) S.parts.push({x:x,y:y,vx:(Math.random()-0.5)*120,vy:-Math.random()*120-60,life:0.35,max:0.35,c:'#FFD23F',s:2.5}); }
function popCoin(x,y){ S.parts.push({x:x,y:y,vx:0,vy:-460,life:0.5,max:0.5,c:'#FFD23F',s:7,coin:true}); }
function updateParts(dt){
  for(var i=S.parts.length-1;i>=0;i--){ var q=S.parts[i];
    q.life-=dt; if(q.life<=0){ S.parts.splice(i,1); continue; }
    q.vy+=1400*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
  }
}

/* ================= 逻辑 ================= */
function bumpBlock(tx,ty,L){
  if(L.grid[ty][tx]==='?'){
    L.grid[ty][tx]='U'; S.bump[tx+','+ty]=0.18;
    addScore(10); sfx('coin'); popCoin(tx*TW+TW/2, ty*TW);
  }else sfx('bump');
}

function updatePlayer(dt,L){
  var p=S.player;
  var ix=(input.right?1:0)-(input.left?1:0);
  if(ix!==0){
    p.face=ix;
    var acc=p.onGround?ACC_G:ACC_A;
    p.vx+=ix*acc*dt;
    if(p.vx>MOVE_V)p.vx=MOVE_V; if(p.vx<-MOVE_V)p.vx=-MOVE_V;
  }else{
    var f=(p.onGround?FRIC:FRIC*0.2)*dt;
    if(Math.abs(p.vx)<=f)p.vx=0; else p.vx-=Math.sign(p.vx)*f;
  }
  if(p.onGround)p.coyote=COYOTE; else p.coyote-=dt;
  if(input.jumpPressed){ p.jbuf=JBUF; input.jumpPressed=false; }
  p.jbuf-=dt;
  if(p.jbuf>0&&p.coyote>0){
    p.vy=-JUMP_V; p.onGround=false; p.coyote=0; p.jbuf=0;
    sfx('jump'); puff(p.x+p.w/2,p.y+p.h);
  }
  if(!input.jump&&p.vy<-260)p.vy=-260; // 松开跳得矮
  p.vy+=GRAV*dt; if(p.vy>MAXFALL)p.vy=MAXFALL;
  p.hitWall=false;
  collideMove(p,p.vx*dt,0,L,null);
  collideMove(p,0,p.vy*dt,L,function(tx,ty){ bumpBlock(tx,ty,L); });
  if(p.invuln>0)p.invuln-=dt;
  p.walkT+=Math.abs(p.vx)*dt*0.045;
  if(p.y>L.R*TW+30) hurt(true); // 掉深渊
}

function updateEnemies(dt,L){
  for(var i=0;i<L.enemies.length;i++){ var e=L.enemies[i];
    if(!e.alive){ e.squish+=dt; continue; }
    e.vy+=GRAV*dt; if(e.vy>MAXFALL)e.vy=MAXFALL;
    e.hitWall=false;
    collideMove(e,e.vx*dt,0,L,null);
    collideMove(e,0,e.vy*dt,L,null);
    if(e.hitWall)e.vx=-e.vx;
    for(var s=0;s<L.spikes.length;s++){ if(overlap(e,L.spikes[s])){ e.alive=false; e.squish=0.0001; poof(e.x+e.w/2,e.y+e.h/2); break; } }
    if(e.y>L.R*TW+60)e.alive=false;
    e.walkT+=dt*7;
  }
}

function checkHazards(L){
  var p=S.player;
  var i,e;
  for(i=0;i<L.enemies.length;i++){ e=L.enemies[i]; if(!e.alive)continue;
    if(overlap(p,e)){
      var stomp=p.vy>60&&(p.y+p.h)-e.y<20;
      if(stomp){
        e.alive=false; e.squish=0.0001; addScore(100); sfx('stomp');
        poof(e.x+e.w/2,e.y+6);
        p.vy=input.jump?-560:-380; p.onGround=false;
      }else if(p.invuln<=0){ hurt(false); return; }
    }
  }
  if(p.invuln<=0) for(i=0;i<L.spikes.length;i++){ if(overlap(p,L.spikes[i])){ hurt(false); return; } }
  var c;
  for(i=0;i<L.coins.length;i++){ c=L.coins[i]; if(c.taken)continue;
    if(overlap(p,{x:c.x-6,y:c.y-6,w:c.w+12,h:c.h+12})){ c.taken=true; addScore(10); sfx('coin'); sparkle(c.x+c.w/2,c.y+c.h/2); }
  }
  if(p.x+p.w/2>=L.goalX+TW/2) levelClear();
}

function hurt(fell){
  var p=S.player;
  if(!fell&&p.invuln>0)return;
  S.lives--; updateHUD(); sfx('hurt');
  if(S.lives<=0){ doGameOver(); return; }
  var sc=S.score;
  startLevel(S.level,true); S.score=sc; updateHUD();
  S.player.invuln=2.5;
  poof(S.player.x+11,S.player.y+14);
}

function levelClear(){
  if(S.state!=='play')return;
  S.state='clear'; addScore(200); sfx('clear');
  if(S.level>=LEVELS.length-1){ doWin(); return; }
  showMsg('🎉 第 '+(S.level+1)+' 关通过！','得分 '+S.score+'（+200 过关奖励）',true,'下一关 →',function(){ startLevel(S.level+1,true); hideMsg(); });
}
function doGameOver(){
  S.state='over';
  showMsg('😵 游戏结束','总分 '+S.score+' · 历史最高 '+best,false,'再来一局',function(){ resetGame(); });
}
function doWin(){
  S.state='win'; sfx('win');
  for(var i=0;i<40;i++) S.parts.push({x:Math.random()*VW,y:Math.random()*VH*0.5,vx:(Math.random()-0.5)*120,vy:Math.random()*80+40,life:1.6,max:1.6,c:['#F0902A','#FFD23F','#FF8FA3','#7FB069'][i%4],s:4});
  showMsg('🏆 全部通关！','总分 '+S.score+' · 历史最高 '+best+'\n阿跳成为了跳跃大师！',false,'再玩一次',function(){ resetGame(); });
}

var msgAction=null;
function showMsg(t,sub,hasBtn,btnText,fn){
  msgText.textContent=t; msgSub.textContent=sub;
  againBtn.style.display=hasBtn?'':'none'; againBtn.textContent=btnText;
  msgAction=fn||null; msg.classList.add('show');
}
function hideMsg(){ msg.classList.remove('show'); msgAction=null; }
againBtn.onclick=function(){ if(msgAction)msgAction(); };

function stepGame(dt){
  S.time+=dt;
  if(S.state==='play'){
    updatePlayer(dt,S.L);
    if(S.state==='play'){ updateEnemies(dt,S.L); checkHazards(S.L); }
  }
  updateParts(dt);
  for(var k in S.bump){ S.bump[k]-=dt; if(S.bump[k]<=0)delete S.bump[k]; }
  var p=S.player, target=Math.max(0,Math.min(S.L.C*TW-VW, p.x+p.w/2-VW*0.42));
  S.camX+=(target-S.camX)*Math.min(1,dt*7);
}

/* ================= 输入 ================= */
var input={left:false,right:false,jump:false,jumpPressed:false};
var KEYMAP={37:'left',65:'left',39:'right',68:'right'};
document.addEventListener('keydown',function(e){
  if(e.keyCode===32||e.keyCode===38||e.keyCode===87){
    e.preventDefault();
    if(!e.repeat){ input.jump=true; input.jumpPressed=true; }
  }else{ var k=KEYMAP[e.keyCode]; if(k){ e.preventDefault(); input[k]=true; } }
});
document.addEventListener('keyup',function(e){
  if(e.keyCode===32||e.keyCode===38||e.keyCode===87){ input.jump=false; }
  else{ var k=KEYMAP[e.keyCode]; if(k)input[k]=false; }
});
function bindHold(el,prop,isJump){
  var on=function(e){ e.preventDefault(); if(isJump){input.jump=true;input.jumpPressed=true;}else input[prop]=true; };
  var off=function(e){ e.preventDefault(); if(isJump)input.jump=false; else input[prop]=false; };
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
}
bindHold(document.getElementById('btnL'),'left',false);
bindHold(document.getElementById('btnR'),'right',false);
bindHold(document.getElementById('btnJ'),null,true);
if('ontouchstart' in window)document.body.classList.add('touch');
var wrapEl=document.getElementById('wrap');
wrapEl.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.getElementById('restart').onclick=function(){ resetGame(); };

/* ================= 渲染（全部 canvas 手绘，原创美术） ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function ellipse(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,6.2832);ctx.fill();}

function drawGround(x,y){
  ctx.fillStyle='#D9A066'; ctx.fillRect(x,y,TW,TW);
  ctx.fillStyle='#E8BC7E'; ctx.fillRect(x,y,TW,7);
  ctx.fillStyle='#B07B3F'; ctx.fillRect(x,y+TW-3,TW,3); ctx.fillRect(x,y,3,TW); ctx.fillRect(x+TW-3,y,3,TW);
  ctx.fillStyle='rgba(176,123,63,.5)';
  ctx.fillRect(x+8,y+14,4,4); ctx.fillRect(x+20,y+20,4,4);
}
function drawQ(x,y,t){
  var b=S.bump[Math.floor(x/TW)+','+Math.floor(y/TW)];
  var off=b? -Math.sin((0.18-b)/0.18*Math.PI)*7 : 0;
  y+=off;
  ctx.fillStyle='#F0902A'; rr(x+1,y+1,TW-2,TW-2,6); ctx.fill();
  ctx.fillStyle='#D97A12'; rr(x+1,y+TW-7,TW-2,5,3); ctx.fill();
  ctx.fillStyle='#FFD9A8';
  var tw=2+Math.sin(t*3+x)*1;
  ctx.fillRect(x+5,y+5,tw,tw); ctx.fillRect(x+TW-5-tw,y+5,tw,tw);
  ctx.fillRect(x+5,y+TW-5-tw,tw,tw); ctx.fillRect(x+TW-5-tw,y+TW-5-tw,tw,tw);
  ctx.fillStyle='#FFF7EC'; ctx.font='bold 19px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('?',x+TW/2,y+TW/2+1);
}
function drawUsed(x,y){
  ctx.fillStyle='#C9A87C'; rr(x+1,y+1,TW-2,TW-2,6); ctx.fill();
  ctx.fillStyle='#A9885E'; rr(x+1,y+TW-7,TW-2,5,3); ctx.fill();
}
function drawCoin(c,t){
  var sx=Math.abs(Math.cos(t*4+c.ph));
  ctx.fillStyle='#E8A812'; ellipse(c.x+c.w/2,c.y+c.h/2,8,8);
  ctx.fillStyle='#FFD23F'; ellipse(c.x+c.w/2,c.y+c.h/2,8*Math.max(0.25,sx),8);
  ctx.fillStyle='#FFF3C4'; ellipse(c.x+c.w/2-2,c.y+c.h/2-2,2.5,2.5);
}
function drawSpike(sp){
  ctx.fillStyle='#6E6E6E'; ctx.fillRect(sp.x-2,sp.y+sp.h-4,sp.w+4,4);
  ctx.fillStyle='#9A9A9A';
  for(var i=0;i<3;i++){ var bx=sp.x+i*8;
    ctx.beginPath(); ctx.moveTo(bx,sp.y+sp.h-2); ctx.lineTo(bx+4,sp.y); ctx.lineTo(bx+8,sp.y+sp.h-2); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#CFCFCF';
  for(var j=0;j<3;j++){ var bx2=sp.x+j*8+2;
    ctx.beginPath(); ctx.moveTo(bx2,sp.y+sp.h-4); ctx.lineTo(bx2+2,sp.y+4); ctx.lineTo(bx2+4,sp.y+sp.h-4); ctx.closePath(); ctx.fill(); }
}
function drawGoal(L,t){
  var gx=L.goalX+TW/2, gyTop=3*TW, gyBot=8*TW;
  ctx.fillStyle='#3FA34D'; ctx.fillRect(gx-3,gyTop,6,gyBot-gyTop);
  ctx.fillStyle='#FFD23F'; circle(gx,gyTop-6,7);
  var wv=Math.sin(t*6)*5;
  ctx.fillStyle='#F0902A';
  ctx.beginPath(); ctx.moveTo(gx+3,gyTop+4); ctx.lineTo(gx+34,gyTop+14+wv); ctx.lineTo(gx+3,gyTop+26); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#FFF7EC'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('终点',gx+16,gyTop+15+wv*0.5);
}
function drawPlayer(p){
  var f=p.face;
  if(p.invuln>0&&Math.floor(p.invuln*12)%2===0)ctx.globalAlpha=0.35;
  ctx.save(); ctx.translate(p.x+p.w/2,p.y+p.h); ctx.scale(f,1);
  // 尾巴
  ctx.strokeStyle='#C97A1F'; ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-7,-9); ctx.quadraticCurveTo(-19,-7,-21,-19); ctx.stroke();
  // 身体（原创小袋鼠）
  ctx.fillStyle='#F0902A'; ellipse(0,-14,9,13);
  ctx.fillStyle='#FFE3B8'; ellipse(2.5,-12,4.5,8.5);
  // 脚
  var hop=p.onGround?Math.sin(p.walkT*6)*2.5:(p.vy<0?3:-2);
  ctx.fillStyle='#D97A12';
  rr(-10,-6-hop*0.4,11,6,3); ctx.fill();
  rr(-1,-6+hop*0.4,12,6,3); ctx.fill();
  // 头
  ctx.fillStyle='#F0902A'; circle(5,-29,9);
  // 耳朵
  ctx.save(); ctx.translate(0,-36); ctx.rotate(-0.18); ellipse(0,-6,3,7); ctx.restore();
  ctx.save(); ctx.translate(8,-36); ctx.rotate(0.18); ellipse(0,-6,3,7); ctx.restore();
  ctx.fillStyle='#FFB3C1';
  ctx.save(); ctx.translate(0,-36); ctx.rotate(-0.18); ellipse(0,-6,1.4,3.4); ctx.restore();
  ctx.save(); ctx.translate(8,-36); ctx.rotate(0.18); ellipse(0,-6,1.4,3.4); ctx.restore();
  // 眼睛
  ctx.fillStyle='#FFF'; circle(8,-30,2.8);
  ctx.fillStyle='#5C3D2E'; circle(8.9,-30,1.4);
  // 小手
  ctx.fillStyle='#D97A12'; ellipse(9,-16,2.6,5);
  ctx.restore(); ctx.globalAlpha=1;
}
function drawEnemy(e){
  if(!e.alive){ // 压扁动画
    var k=Math.min(1,e.squish*6);
    ctx.fillStyle='#C05B4D'; ellipse(e.x+e.w/2,e.y+e.h-3*k,e.w/2,5);
    return;
  }
  var wob=Math.sin(e.walkT)*2;
  ctx.fillStyle='#C05B4D'; ellipse(e.x+e.w/2,e.y+e.h/2+ wob*0.4,e.w/2,e.h/2);
  ctx.fillStyle='#A8433A'; ellipse(e.x+e.w/2,e.y+e.h-4,e.w/2-4,4);
  // 脚
  ctx.fillStyle='#7A3327';
  var f1=Math.sin(e.walkT)*3, f2=-f1;
  ellipse(e.x+8,e.y+e.h-2+f1*0.3,5,3.4); ellipse(e.x+e.w-8,e.y+e.h-2+f2*0.3,5,3.4);
  // 怒眼
  var dir=e.vx<0?-1:1;
  ctx.fillStyle='#FFF'; circle(e.x+e.w/2-5+dir*2,e.y+9,4); circle(e.x+e.w/2+5+dir*2,e.y+9,4);
  ctx.fillStyle='#5C3D2E'; circle(e.x+e.w/2-5+dir*3,e.y+10,2); circle(e.x+e.w/2+5+dir*3,e.y+10,2);
  ctx.strokeStyle='#5C3D2E'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(e.x+6,e.y+3); ctx.lineTo(e.x+13,e.y+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(e.x+e.w-6,e.y+3); ctx.lineTo(e.x+e.w-13,e.y+6); ctx.stroke();
}

function draw(){
  var L=S.L, p=S.player, t=S.time;
  var g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#FFF6E3'); g.addColorStop(1,'#FFE3B8');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // 太阳
  ctx.fillStyle='#FFD98E'; circle(VW-70-S.camX*0.05,52,26);
  ctx.fillStyle='rgba(255,217,142,.4)'; circle(VW-70-S.camX*0.05,52,36);
  // 云（视差）
  ctx.fillStyle='rgba(255,255,255,.92)';
  var cx0=-((S.camX*0.25)%560);
  for(var ci=0;ci<3;ci++){ var ccx=cx0+ci*260+60, ccy=44+(ci%2)*36;
    ellipse(ccx,ccy,34,13); ellipse(ccx+24,ccy+4,24,10); ellipse(ccx-26,ccy+5,22,9); }
  // 远山（视差）
  ctx.fillStyle='#F7D9A0';
  var hx0=-((S.camX*0.45)%400);
  for(var hi=0;hi<4;hi++){ var hxx=hx0+hi*220;
    ctx.beginPath(); ctx.arc(hxx,VH+40,150,Math.PI,0); ctx.fill(); }
  ctx.save(); ctx.translate(-Math.round(S.camX),0);
  var x,y,ch;
  var x0=Math.max(0,Math.floor(S.camX/TW)-1), x1=Math.min(L.C-1,Math.ceil((S.camX+VW)/TW)+1);
  for(y=0;y<L.R;y++)for(x=x0;x<=x1;x++){
    ch=L.grid[y][x];
    if(ch==='#')drawGround(x*TW,y*TW);
    else if(ch==='?')drawQ(x*TW,y*TW,t);
    else if(ch==='U')drawUsed(x*TW,y*TW);
  }
  var i;
  for(i=0;i<L.spikes.length;i++)drawSpike(L.spikes[i]);
  drawGoal(L,t);
  for(i=0;i<L.coins.length;i++){ var cn=L.coins[i]; if(!cn.taken)drawCoin(cn,t); }
  for(i=0;i<L.enemies.length;i++)drawEnemy(L.enemies[i]);
  drawPlayer(p);
  for(i=0;i<S.parts.length;i++){ var q=S.parts[i];
    ctx.globalAlpha=Math.max(0,q.life/q.max);
    ctx.fillStyle=q.c;
    if(q.coin){ ellipse(q.x,q.y,q.s,q.s); ctx.fillStyle='#FFF3C4'; ellipse(q.x-1.5,q.y-1.5,2,2); }
    else circle(q.x,q.y,q.s);
    ctx.globalAlpha=1;
  }
  ctx.restore();
  // 最高分
  ctx.fillStyle='#B08D6E'; ctx.font='12px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillText('最高 '+best, VW-10, 18);
}

/* ================= 主循环 ================= */
var lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=(t-lastT)/1000; lastT=t;
  if(!(dt>0))return; if(dt>1/30)dt=1/30;
  stepGame(dt); draw();
}

/* ================= 测试钩子 ================= */
window.__test={
  get S(){return S;},
  get input(){return input;},
  step:function(dt){ stepGame(dt||1/60); },
  draw:function(){ draw(); },
  resetGame:function(){ resetGame(); },
  startLevel:function(i,keep){ startLevel(i,!!keep); },
  advance:function(){ if(msgAction)msgAction(); },
  setPlayer:function(x,y){ S.player.x=x; S.player.y=y; S.player.vx=0; S.player.vy=0; },
  setLives:function(n){ S.lives=n; updateHUD(); },
  clearEnemies:function(){ S.L.enemies.forEach(function(e){e.alive=false;e.squish=99;}); },
  addEnemy:function(x,y){ S.L.enemies.push({x:x,y:y,w:28,h:24,vx:-45,vy:0,alive:true,squish:0,walkT:0,onGround:false,hitWall:false}); },
  findTiles:function(ch){ var L=S.L,r=[]; for(var y=0;y<L.R;y++)for(var x=0;x<L.C;x++)if(L.grid[y][x]===ch)r.push({tx:x,ty:y}); return r; },
  tileAt:function(x,y){ var L=S.L,tx=Math.floor(x/TW),ty=Math.floor(y/TW);
    if(tx<0||tx>=L.C||ty<0||ty>=L.R)return{solid:false,spike:false,ch:'.'};
    var ch=L.grid[ty][tx];
    return{solid:ch==='#'||ch==='?'||ch==='U',spike:!!L.spikeSet[tx+','+ty],ch:ch}; },
  enemies:function(){ return S.L.enemies.filter(function(e){return e.alive;}).map(function(e){return{x:e.x,y:e.y,w:e.w,h:e.h,vx:e.vx};}); },
  state:function(){ return{state:S.state,level:S.level,score:S.score,lives:S.lives,goalX:S.L.goalX,
    player:{x:S.player.x,y:S.player.y,vx:S.player.vx,vy:S.player.vy,onGround:S.player.onGround},
    aliveEnemies:S.L.enemies.filter(function(e){return e.alive;}).length}; },
  LEVELS:LEVELS, TW:TW
};

resetGame();
if(typeof requestAnimationFrame==='function'){
  requestAnimationFrame(function(t){ lastT=t; frame(t); });
}
})();
</script>
