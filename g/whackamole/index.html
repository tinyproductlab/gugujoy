<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>打地鼠 · 谷谷乐园</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="description" content="打地鼠：谷谷乐园出品的经典反应游戏，30 秒倒计时，地鼠随机冒头，点中得分！手机点按、电脑鼠标都能玩。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF7EC;color:#5C3D2E;-webkit-tap-highlight-color:transparent}
.topbar{max-width:520px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between}
.topbar a.home{color:#8A6B58;text-decoration:none;font-size:14px}
.container{width:500px;max-width:100%;margin:0 auto;padding:0 16px 30px}
.heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0}
h1.title{font-size:32px;font-weight:900;color:#D97A12}
.scores{display:flex;gap:8px}
.score-box{background:#fff;border:2px solid #F3D9B8;border-radius:10px;padding:8px 12px;text-align:center;min-width:70px}
.score-box .num{font-size:22px;font-weight:800}
.score-box .label{font-size:12px;color:#B08D6E}
.above{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.intro{font-size:14px;color:#8A6B58;line-height:1.6}
.restart{background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff;border:0;border-radius:999px;padding:10px 26px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(240,144,42,.35);white-space:nowrap}
.game-wrap{position:relative;background:#E3B98A;border-radius:14px;padding:16px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hole{aspect-ratio:1;background:#D9A96F;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 8px 14px rgba(92,61,46,.35);touch-action:manipulation;overflow:hidden}
.hole span{font-size:52px;transform:translateY(70%) scale(.85);opacity:0;transition:transform .14s ease-out,opacity .14s}
.hole.up span{transform:translateY(6%) scale(1);opacity:1}
.msg{display:none;position:absolute;inset:12px;background:rgba(255,247,236,.92);border-radius:8px;z-index:10;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.msg.show{display:flex}
.msg p{font-size:30px;font-weight:900}
.msg .sub{font-size:15px;color:#8A6B58;line-height:1.6}
.msg button{border:0;border-radius:999px;padding:10px 30px;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#F0902A,#FFB03A);color:#fff}
.howto{margin-top:18px;font-size:14px;color:#8A6B58;line-height:1.8;background:#fff;border:2px solid #FFE3B8;border-radius:14px;padding:16px 18px}
.howto b{color:#D97A12}
.credit{margin-top:14px;font-size:12px;color:#B08D6E;text-align:center}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="/">← 谷谷乐园</a><span style="font-size:13px;color:#B08D6E">🐾 小产品实验室</span></div>
<div class="container">
<div class="heading">
<h1 class="title">🐹 打地鼠</h1>
<div class="scores">
<div class="score-box"><div class="num" id="score">0</div><div class="label">得分</div></div>
<div class="score-box"><div class="num" id="time">30</div><div class="label">剩余秒</div></div>
<div class="score-box"><div class="num" id="best">0</div><div class="label">最高</div></div>
</div>
</div>
<div class="above">
<p class="intro">30 秒倒计时，看你能打中几只地鼠！</p>
<button class="restart" id="startBtn">开始游戏</button>
</div>
<div class="game-wrap" id="wrap">
<div class="holes" id="holes"></div>
<div class="msg show" id="msg"><p id="msgText">🐹 准备好了吗？</p><div class="sub" id="msgSub">地鼠会随机冒头，有时两只一起出现，点中 +1 分！</div><button id="again">开始游戏</button></div>
</div>
<div class="howto"><b>🐾 玩法说明：</b>点「开始游戏」，30 秒内地鼠随机冒头（每次停留 0.6–1.2 秒，有时两只同时出现），点中地鼠 +1 分并把它打回去。时间到自动结算，破纪录会自动存档。</div>
<p class="credit">小产品实验室出品 · 谷谷乐园</p>
</div>
<script>
(function(){
"use strict";
var holesEl=document.getElementById('holes');
var scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), bestEl=document.getElementById('best');
var startBtn=document.getElementById('startBtn');
var msg=document.getElementById('msg'), msgText=document.getElementById('msgText'), msgSub=document.getElementById('msgSub');
var S=null, holeEls=[], tickTimer=null, moleTO=[null,null,null,null,null,null,null,null,null], best=0;
try{ best=parseInt(localStorage.getItem('gugujoy_whackamole_best')||'0',10)||0; }catch(e){}
bestEl.textContent=best;

for(var i=0;i<9;i++){
  var d=document.createElement('div');
  d.className='hole';
  var sp=document.createElement('span');
  sp.textContent='🐹';
  d.appendChild(sp);
  (function(idx){ d.addEventListener('click',function(){ whack(idx); }); })(i);
  holesEl.appendChild(d);
  holeEls.push(d);
}
function activeCount(){ var n=0,k; for(k=0;k<9;k++) if(S.moles[k]) n++; return n; }
function popMole(){
  if(!S.running) return -1;
  return popMoleAt(-1, 600+Math.random()*600);
}
function popMoleAt(idx,dur){
  if(!S.running) return -1;
  var k;
  if(idx<0){ // 随机挑一个空洞
    var free=[];
    for(k=0;k<9;k++) if(!S.moles[k]) free.push(k);
    if(!free.length) return -1;
    idx=free[(Math.random()*free.length)|0];
  }else if(S.moles[idx]){ return -1; }
  S.moles[idx]=true;
  render();
  (function(hole){
    moleTO[hole]=setTimeout(function(){ if(S&&S.moles[hole]){ S.moles[hole]=false; render(); } },dur);
  })(idx);
  return idx;
}
function whack(i){
  if(!S||!S.running) return false;
  if(!S.moles[i]) return false; // 没打中
  S.moles[i]=false;
  if(moleTO[i]){ clearTimeout(moleTO[i]); moleTO[i]=null; }
  S.score++;
  scoreEl.textContent=S.score;
  render();
  return true;
}
function gameTick(){
  if(!S||!S.running) return;
  S.timeLeft-=0.1;
  if(S.timeLeft<=0){ end(); return; }
  timeEl.textContent=Math.ceil(S.timeLeft);
  var n=activeCount();
  if(n===0) popMole();
  else if(n===1&&Math.random()<0.25) popMole(); // 偶尔同时出现两只
}
function start(){
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
  for(var k=0;k<9;k++){ if(moleTO[k]){ clearTimeout(moleTO[k]); moleTO[k]=null; } }
  S={score:0, timeLeft:30, running:true, moles:[false,false,false,false,false,false,false,false,false]};
  scoreEl.textContent='0';
  timeEl.textContent='30';
  startBtn.textContent='重新开始';
  msg.classList.remove('show');
  render();
  popMole();
  tickTimer=setInterval(gameTick,100);
}
function end(){
  S.running=false;
  if(tickTimer){ clearInterval(tickTimer); tickTimer=null; }
  for(var k=0;k<9;k++){ if(moleTO[k]){ clearTimeout(moleTO[k]); moleTO[k]=null; } S.moles[k]=false; }
  render();
  var nb=false;
  if(S.score>best){ best=S.score; nb=true; try{ localStorage.setItem('gugujoy_whackamole_best',String(best)); }catch(e){} }
  bestEl.textContent=best;
  timeEl.textContent='0';
  msgText.textContent='⏰ 时间到！';
  msgSub.textContent='本局 '+S.score+' 分'+(nb?' · 🎉 新纪录！':' · 历史最高 '+best);
  msg.classList.add('show');
  startBtn.textContent='开始游戏';
}
function render(){
  for(var k=0;k<9;k++) holeEls[k].classList.toggle('up',!!(S&&S.moles[k]));
}
startBtn.onclick=start;
document.getElementById('again').onclick=start;
var wrap=document.getElementById('wrap');
wrap.addEventListener('touchstart',function(){},{passive:true});
wrap.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
window.__test={start:start,state:function(){return S;},whack:whack,popMoleAt:popMoleAt,gameTick:gameTick,
  setTime:function(t){ if(S) S.timeLeft=t; }};
})();
</script>
</body>
</html>
